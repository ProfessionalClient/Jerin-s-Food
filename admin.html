<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c6743"><title>ജെറിന്റെ കട | Admin</title><style>
:root{--g:#0c6743;--dark:#08452e;--bg:#f4f6f3;--ink:#17221c;--muted:#66736b;--line:#e0e7e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans Malayalam",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:9px 12px;font-weight:750}.hero{background:linear-gradient(120deg,var(--dark),#168552);color:white;padding:18px clamp(14px,3vw,34px);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hero h1{margin:0;font-size:clamp(22px,4vw,30px)}a{color:inherit}.wrap{max-width:1200px;margin:18px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:15px;box-shadow:0 5px 18px #1b3c2810}.panel h2{font-size:19px;margin:0 0 12px}.field{display:grid;gap:5px;margin-bottom:10px}.field input,.field select{width:100%;padding:11px;border:1px solid #d4ded6;border-radius:10px}.primary{background:var(--g);color:white}.secondary{background:#e8f0e9;color:#174a32}.danger{background:#fff0ef;color:#a42c25}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:190px;padding:10px;border:1px solid #d4ded6;border-radius:10px}.order{border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.code{font-weight:900;color:var(--g);font-size:17px}.muted{font-size:12px;color:var(--muted)}.badge{display:inline-block;border-radius:20px;padding:4px 9px;background:#e8f5ec;color:#14643b;font-size:12px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}.actions select{padding:8px;border:1px solid #d4ded6;border-radius:9px}.error{color:#a42c25}.success{color:#0c6743}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f0f6f1;border-radius:12px;padding:12px}.stat strong{display:block;font-size:22px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px 4px;text-align:left;border-bottom:1px solid #e5e9e6}td:not(:first-child),th:not(:first-child){text-align:right}@media(max-width:600px){.panel{padding:12px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
</style></head><body><header class="hero"><div><h1>🔐 ജെറിന്റെ കട — Admin</h1><div>ഓർഡറുകൾ · സ്റ്റാറ്റസ് · PDF ബിൽ</div></div><div class="actions" style="margin:0"><a href="/">← ഓർഡർ സൈറ്റ്</a><button id="logout" class="secondary hidden">Logout</button></div></header><main class="wrap">
<section id="loginPanel" class="panel"><h2>കട ഉടമയുടെ ലോഗിൻ</h2><p class="muted">ഓർഡറുകൾ കാണാൻ അഡ്മിൻ പാസ്‌വേഡ് നൽകുക.</p><form id="loginForm"><div class="field"><label for="password">Admin password</label><input id="password" type="password" required autocomplete="current-password" placeholder="Hosting-ൽ സജ്ജമാക്കിയ പാസ്‌വേഡ്"></div><button class="primary" type="submit">Login</button><p id="loginMsg" role="status"></p></form></section>
<section id="dashboard" class="hidden"><div class="panel"><h2>📊 ഓർഡർ സംഗ്രഹം</h2><div class="stats"><div class="stat"><span class="muted">ഇന്ന് ലഭിച്ച ഓർഡറുകൾ</span><strong id="todayCount">0</strong></div><div class="stat"><span class="muted">ഇന്ന് ആകെ തുക</span><strong id="todayTotal">₹0</strong></div><div class="stat"><span class="muted">ലോഡ് ചെയ്ത ഓർഡറുകൾ</span><strong id="allCount">0</strong></div></div></div><div class="panel"><h2>📋 എല്ലാ ഓർഡറുകളും</h2><div class="toolbar"><input id="filter" placeholder="ഓർഡർ കോഡ് / പേര് / ഫോൺ തിരയുക"><button id="refresh" class="secondary">Refresh</button><button id="export" class="secondary">CSV Export</button></div><div id="orders"><div class="muted">ഓർഡറുകൾ ലോഡ് ചെയ്യുന്നു…</div></div></div><div class="panel"><h2>🔎 ഓർഡർ കോഡ് നൽകി തുറക്കുക</h2><div class="toolbar"><input id="lookup" placeholder="JK-YYYYMMDD-XXXXXXXX"><button id="find" class="primary">Find</button></div><div id="detail"></div></div></section></main>
<script>
const $=id=>document.getElementById(id);let orders=[];const rupees=n=>'₹'+Number(n||0).toLocaleString('en-IN');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function checkLogin(){try{const d=await api('/api/admin/me');if(d.loggedIn)showDashboard();else showLogin()}catch{showLogin()}}function showLogin(){$('loginPanel').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden')}function showDashboard(){$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');loadOrders()}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='Checking…';$('loginMsg').className='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';$('loginMsg').textContent='';showDashboard()}catch(err){$('loginMsg').textContent=err.message;$('loginMsg').className='error'}};
$('logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST',body:'{}'})}finally{showLogin()}};
async function loadOrders(){try{const d=await api('/api/admin/orders?limit=500');orders=d.orders;const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});const todays=orders.filter(o=>new Date(o.date).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})===today);$('todayCount').textContent=todays.length;$('todayTotal').textContent=rupees(todays.reduce((s,o)=>s+o.total,0));$('allCount').textContent=orders.length;renderOrders()}catch(e){$('orders').innerHTML=`<p class="error">${esc(e.message)} — വീണ്ടും login ചെയ്ത് നോക്കുക.</p>`}}
function renderOrders(){const q=$('filter').value.trim().toLowerCase();const list=orders.filter(o=>[o.code,o.customer,o.phone,o.seat,o.status].join(' ').toLowerCase().includes(q));if(!list.length){$('orders').innerHTML='<p class="muted">ഓർഡറുകൾ ഒന്നും കണ്ടെത്തിയില്ല.</p>';return}$('orders').innerHTML=list.map(o=>`<article class="order"><div class="orderhead"><div><div class="code">${esc(o.code)}</div><div class="muted">${new Date(o.date).toLocaleString('en-IN')} · ${esc(o.seat)} · ${esc(o.customer||'പേര് നൽകിയിട്ടില്ല')}</div><div><b>${rupees(o.total)}</b> · ${o.items.length} ഇനം · <span class="badge">${esc(o.status)}</span></div></div><div class="muted">${esc(o.phone||'ഫോൺ നൽകിയിട്ടില്ല')}</div></div><div class="actions"><button class="primary" onclick="showDetail('${esc(o.code)}')">വിശദാംശങ്ങൾ</button><button class="secondary" onclick="downloadPdf('${esc(o.code)}')">PDF</button><select aria-label="Order status" onchange="changeStatus('${esc(o.code)}',this.value)"><option ${o.status==='പുതിയത്'?'selected':''}>പുതിയത്</option><option ${o.status==='തയ്യാറാക്കുന്നു'?'selected':''}>തയ്യാറാക്കുന്നു</option><option ${o.status==='പൂർത്തിയായി'?'selected':''}>പൂർത്തിയായി</option><option ${o.status==='റദ്ദാക്കി'?'selected':''}>റദ്ദാക്കി</option></select></div></article>`).join('')}
function detailHtml(o){return `<article class="order"><div class="orderhead"><div><h3 style="margin:0">ജെറിന്റെ കട</h3><b>Order code:</b> ${esc(o.code)}<br><b>Date:</b> ${new Date(o.date).toLocaleString('en-IN')}<br><b>Table / type:</b> ${esc(o.seat)}<br><b>Customer:</b> ${esc(o.customer||'—')}<br><b>Phone:</b> ${esc(o.phone||'—')}<br><b>Note:</b> ${esc(o.note||'—')}</div><span class="badge">${esc(o.status)}</span></div><div class="tablewrap"><table><thead><tr><th>ഭക്ഷണം</th><th>വില</th><th>Qty</th><th>തുക</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${rupees(i.price)}</td><td>${i.qty}</td><td>${rupees(i.lineTotal)}</td></tr>`).join('')}</tbody></table></div><h2 style="text-align:right">ആകെ: ${rupees(o.total)}</h2><div class="actions"><button class="primary" onclick="downloadPdf('${esc(o.code)}')">PDF ഡൗൺലോഡ്</button><button class="secondary" onclick="printBill('${esc(o.code)}')">Print / Save PDF</button></div></article>`}
function showDetail(code){const o=orders.find(x=>x.code===code);if(!o)return;$('lookup').value=code;$('detail').innerHTML=detailHtml(o);$('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}
async function changeStatus(code,status){try{const d=await api('/api/admin/orders/'+encodeURIComponent(code)+'/status',{method:'PATCH',body:JSON.stringify({status})});orders=orders.map(o=>o.code===code?d.order:o);renderOrders();if($('lookup').value.toUpperCase()===code)showDetail(code)}catch(e){alert(e.message);loadOrders()}}
function printable(o){return `<!doctype html><html lang="ml"><head><meta charset="utf-8"><title>${esc(o.code)}</title><style>body{font:14px system-ui,"Noto Sans Malayalam",sans-serif;padding:22px;color:#111}h2{margin:0}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{border-bottom:1px solid #ddd;padding:8px 4px;text-align:left}th:not(:first-child),td:not(:first-child){text-align:right}.total{text-align:right;font-size:20px;font-weight:bold;margin-top:18px}</style></head><body><h2>ജെറിന്റെ കട</h2><p>ഓർഡർ ബിൽ</p><p><b>Order code:</b> ${esc(o.code)}<br><b>Date:</b> ${new Date(o.date).toLocaleString('en-IN')}<br><b>Table/type:</b> ${esc(o.seat)}<br><b>Customer:</b> ${esc(o.customer||'—')}<br><b>Phone:</b> ${esc(o.phone||'—')}<br><b>Note:</b> ${esc(o.note||'—')}</p><table><thead><tr><th>ഭക്ഷണം</th><th>വില</th><th>Qty</th><th>തുക</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${rupees(i.price)}</td><td>${i.qty}</td><td>${rupees(i.lineTotal)}</td></tr>`).join('')}</tbody></table><div class="total">ആകെ: ${rupees(o.total)}</div><p>Status: ${esc(o.status)}</p><p style="text-align:center;margin-top:30px">നന്ദി! വീണ്ടും വരിക.</p><script>window.onload=()=>window.print()<\/script></body></html>`}
async function printBill(code){const o=orders.find(x=>x.code===code);if(!o)return;const w=window.open('','_blank','width=720,height=850');if(!w){alert('Popup അനുവദിക്കുക.');return}w.document.open();w.document.write(printable(o));w.document.close()}
async function downloadPdf(code){const o=orders.find(x=>x.code===code);if(!o)return;try{if(!window.html2pdf)await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-10000px;top:0;width:760px;background:white;color:#111;padding:28px;font-family:system-ui,"Noto Sans Malayalam",sans-serif';holder.innerHTML=detailHtml(o).replace(/<div class="actions">[\s\S]*?<\/div><\/article>/,'</article>');document.body.appendChild(holder);await window.html2pdf().set({margin:8,filename:o.code+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(holder).save();holder.remove()}catch(e){printBill(code)}}
$('refresh').onclick=loadOrders;$('filter').addEventListener('input',renderOrders);$('find').onclick=()=>{const code=$('lookup').value.trim().toUpperCase();const o=orders.find(x=>x.code===code);if(o)showDetail(code);else $('detail').innerHTML='<p class="error">ഈ ഓർഡർ കോഡ് ലോഡ് ചെയ്ത ലിസ്റ്റിൽ കണ്ടെത്തിയില്ല. Refresh ചെയ്യുക.</p>'};$('lookup').addEventListener('keydown',e=>{if(e.key==='Enter')$('find').click()});$('export').onclick=()=>{const rows=[['Code','Date','Type','Customer','Phone','Items','Total','Status'],...orders.map(o=>[o.code,new Date(o.date).toISOString(),o.seat,o.customer,o.phone,o.items.map(i=>`${i.name} x${i.qty}`).join('; '),o.total,o.status])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='jerinte-kada-orders.csv';a.click();URL.revokeObjectURL(a.href)};
checkLogin();
</script></body></html>
